name: Release tools
description: 'Outputs the path of this repository''s release CLI. Reference it with the self-repository syntax (uses: $/.github/actions/release-tools), so the tools come from the same commit as the calling workflow.'
outputs:
  cli:
    description: Absolute path of scripts/release/cli.mjs.
    value: ${{ steps.locate.outputs.cli }}
runs:
  using: composite
  steps:
    - name: Locate the release tools
      id: locate
      shell: bash
      run: |
        cli="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)/scripts/release/cli.mjs"
        test -f "$cli"
        echo "cli=$cli" >> "$GITHUB_OUTPUT"
