name: Submodules
description: 'Checks out git submodules (recursively) at the commits pinned in the checked-out ref, never with --remote. Private submodules over SSH need ssh-private-key; it is unloaded from ssh-agent right after the fetch, before any package code runs. Reference it with the self-repository syntax (uses: $/.github/actions/submodules).'
inputs:
  ssh-private-key:
    description: SSH private key(s) for the submodule repositories. Several deploy keys are mapped to their repositories by key comment (webfactory/ssh-agent).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Load the SSH key
      if: inputs.ssh-private-key != ''
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Check out submodules
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
        git submodule status --recursive
        # The key is only needed for the fetch: drop it before npm ci runs install scripts.
        if [[ -n "${SSH_AUTH_SOCK:-}" ]]; then ssh-add -D; fi
