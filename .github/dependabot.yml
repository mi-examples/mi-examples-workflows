version: 2

updates:
  - package-ecosystem: github-actions
    # The composite actions pin third-party actions too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Give the community a week to spot a compromised release before we pick it up.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
