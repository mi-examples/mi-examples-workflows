name: Back-merge

# After a production release, opens a pull request that merges main back into
# develop, and turns on auto-merge (merge commit) when the repository allows
# it. Without this, develop never contains the release tag, and the next beta
# would be computed from a stale baseline.
#
# It opens a pull request instead of pushing to develop, so develop's
# required checks run on the merge. The GitHub App token is used because
# pull requests opened with GITHUB_TOKEN don't trigger CI. It needs
# `contents: write`: GitHub refuses both a merge and auto-merge to a token
# that can only read the contents. With required checks pending, auto-merge
# merges once they pass; without any, the pull request is merged right away.
# Merge conflicts are left in the pull request for a person to resolve.
#
# Skipped when the repository has no develop branch, or when develop already
# contains main.
#
# The caller job needs `permissions: contents: read`, and passes the App's
# client ID and key.

on:
  workflow_call:
    inputs:
      client-id:
        description: Client ID of the GitHub App that opens the pull request (`vars.WORKFLOWS_BOT_CLIENT_ID`).
        type: string
        default: ''
      app-id:
        description: Deprecated, use `client-id`. ID of the GitHub App, still accepted for now.
        type: string
        default: ''
      base:
        description: Branch to merge main into.
        type: string
        default: develop
      head:
        description: Branch that was released.
        type: string
        default: main
      version:
        description: Released version, used in the pull request title.
        type: string
        default: ''
    secrets:
      app-key:
        description: Private key of the GitHub App.
        required: true

permissions: {}

jobs:
  back-merge:
    name: Back-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          VERSION: ${{ inputs.version }}
        run: |
          branch_re='^[A-Za-z0-9._/-]+$'
          [[ "$BASE" =~ $branch_re && "$HEAD" =~ $branch_re ]] || { echo "::error::Invalid branch name"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version: $VERSION"; exit 1; }

      - name: Check the GitHub App input
        env:
          CLIENT_ID: ${{ inputs.client-id }}
          APP_ID: ${{ inputs.app-id }}
        run: |
          if [[ -z "$CLIENT_ID" && -z "$APP_ID" ]]; then
            echo "::error::Pass the GitHub App's client ID in the client-id input (vars.WORKFLOWS_BOT_CLIENT_ID)."
            exit 1
          fi
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::warning::The app-id input is deprecated and will be removed. Pass client-id with vars.WORKFLOWS_BOT_CLIENT_ID instead: re-run the installer, or merge the drift-sync pull request."
          fi

      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.client-id || inputs.app-id }}
          private-key: ${{ secrets.app-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # merging, or enabling auto-merge, needs it
          permission-pull-requests: write

      - name: Open the back-merge pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh api "repos/$REPO/branches/$BASE" --silent 2>/dev/null; then
            echo "No $BASE branch; nothing to merge back."
            exit 0
          fi

          ahead="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq .ahead_by)"
          if [[ "$ahead" == "0" ]]; then
            echo "$BASE already contains $HEAD."
            exit 0
          fi

          number="$(gh pr list --repo "$REPO" --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            echo "Back-merge pull request #$number is already open."
          else
            title="chore: merge $HEAD into $BASE${VERSION:+ after v$VERSION}"
            body="$(printf '%s\n\n%s\n' \
              "Merges \`$HEAD\` back into \`$BASE\` after the release, so the next beta is computed from the released version." \
              "Opened automatically. If it has conflicts, resolve them in this pull request; don't squash, the merge commit keeps the release tag reachable from \`$BASE\`.")"
            url="$(gh pr create --repo "$REPO" --base "$BASE" --head "$HEAD" --title "$title" --body "$body")"
            number="${url##*/}"
            echo "Opened $url"
          fi

          # Mergeability is computed in the background; it is UNKNOWN right after the pull request opens.
          mergeable=UNKNOWN
          for delay in 2 4 8 16 30; do
            mergeable="$(gh pr view "$number" --repo "$REPO" --json mergeable --jq .mergeable)"
            [[ "$mergeable" != "UNKNOWN" ]] && break
            sleep "$delay"
          done
          if [[ "$mergeable" == "CONFLICTING" ]]; then
            echo "::warning::#$number has merge conflicts. Resolve them in the pull request and merge it with a merge commit."
            exit 0
          fi

          # With required checks pending this turns on auto-merge; when nothing is pending, gh merges right away.
          error=""
          for delay in 0 10 30; do
            sleep "$delay"
            if error="$(gh pr merge "$number" --repo "$REPO" --auto --merge 2>&1)"; then
              error=""
              break
            fi
            error="${error//$'\n'/ }"
            echo "Attempt failed: $error"
          done
          if [[ -n "$error" ]]; then
            echo "::warning::Could not merge #$number or turn on auto-merge: $error. Merge it with a merge commit."
            exit 0
          fi

          state="$(gh pr view "$number" --repo "$REPO" --json state --jq .state)"
          if [[ "$state" == "MERGED" ]]; then
            echo "Merged #$number (merge commit)."
          else
            echo "Auto-merge (merge commit) is on for #$number; it merges once the required checks pass."
          fi
