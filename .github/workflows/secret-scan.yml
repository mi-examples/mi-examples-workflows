name: Secret scan

# Scans git history for secrets with gitleaks. Findings are redacted in the
# log.
#
# - pull_request: the commits in the pull request.
# - push: the pushed commits.
# - anything else (schedule, workflow_dispatch): the whole history.
#
# Runs the gitleaks release binary, verified against a hardcoded SHA-256,
# because gitleaks-action needs a license key for organizations. A
# `.gitleaks.toml` in the repository root is picked up automatically.
#
# The caller job needs `permissions: contents: read`.

on:
  workflow_call:
    inputs:
      full-history:
        description: Scan the whole history even on pull_request and push events.
        type: boolean
        default: false

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full-history }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=""
          if [[ "$FULL_HISTORY" != "true" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          fi

          args=(git --redact --no-banner --exit-code 1 --verbose)
          if [[ -n "$range" ]]; then
            if [[ ! "$range" =~ ^[0-9a-f]{40}\.\.[0-9a-f]{40}$ ]]; then
              echo "::error::Unexpected commit range: $range"
              exit 1
            fi
            echo "Scanning commits $range"
            args+=(--log-opts "$range")
          else
            echo "Scanning the whole history"
          fi

          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
